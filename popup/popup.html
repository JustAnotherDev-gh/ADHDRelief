<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADHDRelief</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="scroll-area">
    <div class="container">
    <!-- Header -->
    <header class="header">
      <img src="../icons/logo.png" alt="ADHD Relief Logo" class="logo">
      <h1 class="title">ADHD Relief</h1>
    </header>

    <!-- Mode Selector -->
    <div class="mode-selector">
      <button id="mode-constant" class="mode-btn active" data-mode="constant" data-i18n="modeConstant">
        Continuous
      </button>
      <button id="mode-break" class="mode-btn" data-mode="break" data-i18n="modeBreak">
        Break Mode
      </button>
    </div>

    <!-- Noise Type Selector -->
    <div id="noise-selector" class="noise-selector">
      <!-- Built-in sounds and My Vibe button will be added here dynamically -->
    </div>

    <!-- Hidden file input for My Vibe -->
    <input type="file" id="audio-file-input" accept="audio/*" style="display: none;">

    <!-- Custom Sound Name Dialog -->
    <div id="name-dialog" class="name-dialog hidden">
      <div class="name-dialog-content">
        <h3 data-i18n="dialogTitle">Name Your Vibe</h3>
        <input type="text" id="vibe-name-input" data-i18n-placeholder="dialogPlaceholder" placeholder="Enter a name..." maxlength="20">
        <div class="name-dialog-buttons">
          <button id="name-cancel-btn" class="dialog-btn secondary" data-i18n="btnCancel">Cancel</button>
          <button id="name-save-btn" class="dialog-btn primary" data-i18n="btnSave">Save</button>
        </div>
      </div>
    </div>

    <!-- Play/Pause Control -->
    <div class="control-section">
      <button id="play-btn" class="play-btn" aria-label="Play">
        <svg class="play-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <svg class="pause-icon hidden" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="6" y="4" width="4" height="16"></rect>
          <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
      </button>
      <span id="play-status" class="play-status">Ready</span>
    </div>

    <!-- Volume Control -->
    <div class="control-section">
      <label for="volume-slider" class="control-label">
        <span data-i18n="labelVolume">Volume</span>: <span id="volume-value">50</span>%
      </label>
      <input
        type="range"
        id="volume-slider"
        class="volume-slider"
        min="0"
        max="100"
        value="50"
        data-i18n-aria-label="tooltipVolume"
        aria-label="Volume control"
      >
    </div>

    <!-- Timer Section (visible in Break Mode) -->
    <div id="timer-section" class="timer-section hidden">
      <div class="timer-header">
        <h2 class="section-title" data-i18n="timerTitle">Timer</h2>
        <div class="phase-indicator">
          <span id="current-phase" class="phase-badge">Focus</span>
        </div>
      </div>

      <!-- Timer Display -->
      <div class="timer-display">
        <span id="timer-value" class="timer-value">25:00</span>
      </div>

      <!-- Timer Controls -->
      <div class="timer-controls">
        <button id="start-timer-btn" class="timer-btn" data-i18n="btnStartTimer">Start</button>
        <button id="stop-timer-btn" class="timer-btn secondary hidden" data-i18n="btnStopTimer">Stop</button>
      </div>

      <!-- Preset Selector -->
      <div class="preset-section">
        <label class="control-label">Preset:</label>
        <div class="preset-buttons">
          <button class="preset-btn active" data-preset="25/5" data-i18n="presetPomodoro">25/5</button>
          <button class="preset-btn" data-preset="50/10" data-i18n="presetExtended">50/10</button>
          <button class="preset-btn" data-preset="custom" data-i18n="presetCustom">Custom</button>
        </div>
      </div>

      <!-- Custom Timer Settings (visible when Custom is selected) -->
      <div id="custom-settings" class="custom-settings hidden">
        <div class="input-group">
          <label for="focus-duration" class="input-label" data-i18n="labelFocusDuration">Focus (min):</label>
          <input
            type="number"
            id="focus-duration"
            class="time-input"
            min="1"
            max="120"
            value="25"
          >
        </div>
        <div class="input-group">
          <label for="break-duration" class="input-label" data-i18n="labelBreakDuration">Break (min):</label>
          <input
            type="number"
            id="break-duration"
            class="time-input"
            min="1"
            max="60"
            value="5"
          >
        </div>
      </div>
    </div>

    <!-- Info Section -->
    <div class="info-section">
      <a href="https://buymeacoffee.com/justanotherdev" target="_blank" class="coffee-link" title="Support the developer">
        <span class="coffee-icon">☕</span>
        <span>Coffee</span>
      </a>
      <p class="info-text">
        <strong>Constant:</strong> Noise plays continuously<br>
        <strong>Break Mode:</strong> Noise during breaks only
      </p>
      <p class="privacy-text">
        No tracking. No accounts. Runs locally.
      </p>
    </div>
  </div>
  </div>

  <script src="custom-sounds.js"></script>
  <script src="popup.js"></script>
</body>
</html>
